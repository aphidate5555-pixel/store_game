name: ci

# The order is deliberate. A cheap check that catches a type error runs
# before an expensive one that catches a rendering failure, so a typo costs
# seconds rather than a full build.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Never a service_role key. The application talks to Supabase with the
  # published anon key only, and assert-no-service-key enforces it (F-16).
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_E2E_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_E2E_ANON_KEY }}
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100

jobs:
  verify:
    name: typecheck, lint, unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: typecheck
        run: npx tsc --noEmit

      - name: lint
        run: npx eslint .

      - name: no privileged key in the repository
        run: node scripts/assert-no-service-key.mjs

      - name: unit tests
        run: npx vitest run --exclude 'tests/guards/**'

  build:
    name: production build
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

  guard:
    name: database guard
    runs-on: ubuntu-latest
    needs: verify
    # F-06: schema drift needs a direct Postgres connection. Without the
    # secret this job reports as skipped rather than green — a guard suite
    # that passes because it could not run is worse than one that fails.
    if: ${{ secrets.SUPABASE_CI_DB_URL != '' }}
    env:
      SUPABASE_CI_DB_URL: ${{ secrets.SUPABASE_CI_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx vitest run tests/guards

  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    needs: [verify, build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: install browser
        run: npx playwright install --with-deps chromium

      - name: seed the e2e database
        # F-16: how the test data gets there, stated rather than implied.
        # SUPABASE_ACCESS_TOKEN is a CI secret used to create the admin user
        # through the Management API; SUPABASE_CI_DB_URL applies the SQL.
        # Neither ever reaches the application bundle.
        run: node scripts/seed-e2e.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_CI_DB_URL: ${{ secrets.SUPABASE_CI_DB_URL }}
          SUPABASE_E2E_PROJECT_REF: ${{ secrets.SUPABASE_E2E_PROJECT_REF }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}

      - name: end-to-end tests
        run: npx playwright test
        env:
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
